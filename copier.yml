_subdirectory: template
_answers_file: .copier-answers.yml

# Files that are only generated once and never overwritten by `copier update`. README.md is not among them:
# its generic parts (badges, Installation, Compatibility, Development) are merged on update, the library's own
# sections are left alone, and a line both sides changed is marked as a conflict to resolve by hand. The template
# ends with Compatibility and a fixed marker comment; the library's own text starts after the marker
_skip_if_exists:
    - "{{ package_name }}/__init__.py"
    - tests/__init__.py

package_name:
    type: str
    help: Package name, used both on PyPI and as the import name (e.g. ddutils)
    validator: "{% if not (package_name | regex_search('^[a-z][a-z0-9_]+$')) %}package_name must be a valid lowercase Python identifier{% endif %}"

package_description:
    type: str
    help: Short package description (used on PyPI)

package_keywords:
    type: str
    help: Comma-separated PyPI keywords
    default: "python, {{ package_name }}"

min_python_version:
    type: str
    help: Minimum supported Python version
    choices: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    default: "3.10"

max_python_version:
    type: str
    help: Maximum supported Python version (defines the CI test matrix together with min_python_version)
    choices: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    default: "3.15"

test_matrix:
    type: str
    help: >-
        JSON object with extra axes for the CI test matrix (the `python-version` axis is added automatically).
        Every axis value is a pip install spec, `include`/`exclude` work as in GitHub Actions. Leave {} to skip.
        Example: {"pydantic": ["pydantic[email]==2.1", "pydantic[email]==2.13"], "exclude": [{"python-version": "3.13", "pydantic": "pydantic[email]==2.1"}]}
    default: "{}"
    validator: "{% if not (test_matrix | trim | regex_search('^\\{[\\s\\S]*\\}$')) %}test_matrix must be a JSON object{% endif %}"

copyright_year:
    type: int
    help: Year for the LICENSE copyright line
    default: 2026
