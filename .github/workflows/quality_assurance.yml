name: Quality Assurance

on:
    workflow_call:
        inputs:
            package-name:
                description: 'Package import name (used for coverage report)'
                type: string
                required: true
            test-matrix:
                description: >-
                    JSON object used verbatim as the GitHub `strategy.matrix` of the tests job.
                    `python-version` is the only mandatory axis; every other axis holds pip install specs
                    (e.g. "pydantic[email]==2.1") and all of them are installed on top of the locked
                    environment before running tests. `include`/`exclude` work as in GitHub Actions.
                    Example: {"python-version": ["3.10", "3.11"], "pydantic": ["pydantic[email]==2.1", "pydantic[email]==2.13"]}
                type: string
                required: true
            default-python-version:
                description: 'Python version used for linters and coverage'
                type: string
                required: false
                default: '3.14'
            upload-coverage:
                description: 'Collect coverage and upload results to Codecov'
                type: boolean
                required: false
                default: false
        secrets:
            CODECOV_TOKEN:
                required: false

jobs:
    linters:
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                command: [
                    "ruff check . --config ruff.toml",
                    "ruff format . --check --config ruff.toml",
                    "ty check --python .venv",
                    "complexipy"
                ]
        steps:
            -   uses: actions/checkout@v7.0.1
            -   uses: astral-sh/setup-uv@v9.0.0
                with:
                    # renovate: datasource=github-releases depName=astral-sh/uv
                    version: "0.12.1"
                    python-version: ${{ inputs.default-python-version }}
                    enable-cache: true
            -   name: Install dependencies
                run: uv sync --frozen --all-groups
            -   name: Run linter
                run: uv run --no-sync ${{ matrix.command }}
    tests:
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(inputs.test-matrix) }}
        steps:
            -   uses: actions/checkout@v7.0.1
            -   uses: astral-sh/setup-uv@v9.0.0
                with:
                    # renovate: datasource=github-releases depName=astral-sh/uv
                    version: "0.12.1"
                    python-version: ${{ matrix.python-version }}
                    enable-cache: true
            -   name: Install dependencies
                run: uv sync --frozen --group test
            # Every matrix axis except `python-version` is a pip install spec; install them all
            # into the synced .venv (pytest runs with --no-sync so uv won't revert them).
            -   name: Install matrix dependencies
                env:
                    MATRIX: ${{ toJSON(matrix) }}
                run: |
                    SPECS=$(echo "$MATRIX" | jq -r 'del(."python-version") | .[]')
                    if [ -n "$SPECS" ]; then
                        echo "$SPECS" | xargs uv pip install
                    else
                        echo "No matrix dependencies to install"
                    fi
            -   name: Run tests
                run: uv run --no-sync pytest
    # Single check to require in branch rulesets instead of listing every linter / matrix job
    passed:
        runs-on: ubuntu-24.04
        needs: [linters, tests]
        if: always()
        steps:
            -   name: Check that linters and tests succeeded
                run: |
                    if [ "${{ needs.linters.result }}" != "success" ] || [ "${{ needs.tests.result }}" != "success" ]; then
                        echo "linters: ${{ needs.linters.result }}, tests: ${{ needs.tests.result }}"
                        exit 1
                    fi
    coverage:
        if: inputs.upload-coverage
        runs-on: ubuntu-24.04
        steps:
            -   uses: actions/checkout@v7.0.1
            -   uses: astral-sh/setup-uv@v9.0.0
                with:
                    # renovate: datasource=github-releases depName=astral-sh/uv
                    version: "0.12.1"
                    python-version: ${{ inputs.default-python-version }}
                    enable-cache: true
            -   name: Install dependencies
                run: uv sync --frozen --group test
            -   name: Run tests with coverage
                run: uv run --no-sync pytest --cov=${{ inputs.package-name }} --cov-report=xml
            -   name: Upload results to Codecov
                uses: codecov/codecov-action@v7.0.0
                with:
                    verbose: true
                    files: ./coverage.xml
                    flags: unittests
                    token: ${{ secrets.CODECOV_TOKEN }}
